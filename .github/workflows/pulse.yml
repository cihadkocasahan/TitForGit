name: TitForGit Engine
on:
  schedule:
    # Runs every 2 hours UTC
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TitForGit Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_FOLLOW_BACK: 'true'
          NICHE_DISCOVERY_ENABLED: 'true'
          TARGET_TOPICS: 'delphi,mcp,ai-agents'
          DAILY_STAR_LIMIT: '2'
          RUN_MODE: 'cron'
          TITFORGIT_DATA_DIR: 'state'
        run: |
          mkdir -p state
          python titforgit.py

      - name: Commit & Push State Sync
        run: |
          git config --global user.name "titforgit-bot"
          git config --global user.email "bot@titforgit.local"
          git add state/titforgit_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update titforgit state [skip ci]" && git push)
