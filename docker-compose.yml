version: '3.8'

services:
  titforgit:
    build: .
    image: titforgit:latest
    container_name: titforgit
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - RUN_MODE=server
      - INTERVAL_SECONDS=3600
    volumes:
      - titforgit_data:/data

volumes:
  titforgit_data:
